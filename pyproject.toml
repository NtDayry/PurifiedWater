[project]
name = "ocr-service"
version = "0.1.0"
description = "OCR API with FastAPI"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]",
    "python-multipart",
    # --- PostgreSQL ---
    "sqlalchemy==2.0.41",
    "asyncpg==0.30.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "pydantic-settings>=2.0.0",
    # Redis async client
    "redis>=4.5.0",
    "aiohttp>=3.14.1",
    # System monitoring
    "psutil>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "locust",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests/backend"]
markers = [
    "backend: backend test suite",
    "frontend: frontend test suite",
]